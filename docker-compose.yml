services:
  postgres:
    image: postgres:16-alpine
    container_name: fil-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fil_ai}
      POSTGRES_USER: ${POSTGRES_USER:-fil_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fil_ai_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fil_ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fil_ai_postgres_data:
